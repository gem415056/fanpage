<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Twitter RP Feed</title>
  <style>
    /* ==========================================================================
       1. 디자인 시스템 (다크 / 라이트 모드)
       ========================================================================== */
    :root[data-theme="dark"] {
      --bg-color: #17191c;
      --card-bg: #17191c;
      --border-color: #282b30;
      --text-main: #c4c9cf;
      --text-sub: #7d848c;
      --hover-bg: rgba(231, 233, 234, 0.05);
      --primary: #1d9bf0;
      --like-color: #f91880;
      --retweet-color: #00ba7c;
      --modal-overlay: rgba(0, 0, 0, 0.6);
      --modal-bg: #1e2125;
      --thread-line: #2d3136;
    }

    :root[data-theme="light"] {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --border-color: #e5e8eb;
      --text-main: #33373d;
      --text-sub: #6c737c;
      --hover-bg: rgba(15, 20, 25, 0.04);
      --primary: #1d9bf0;
      --like-color: #f91880;
      --retweet-color: #00ba7c;
      --modal-overlay: rgba(0, 0, 0, 0.4);
      --modal-bg: #ffffff;
      --thread-line: #dbe0e5;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    *::-webkit-scrollbar {
      display: none;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    #app {
      width: 100%;
      max-width: 600px;
      min-height: 100vh;
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      position: relative;
      background-color: var(--bg-color);
    }

    /* 최상단 헤더 */
    header {
      position: sticky;
      top: 0;
      height: 53px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background-color: var(--bg-color);
      opacity: 0.98;
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      z-index: 100;
    }
    .header-group { display: flex; align-items: center; gap: 24px; }
    .header-actions-right { display: flex; align-items: center; z-index: 2; }
    .header-logo {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 28px;
      height: 28px;
      fill: var(--primary);
      cursor: pointer;
      z-index: 1;
    }

    .icon-btn {
      background: none; border: none; cursor: pointer; width: 36px; height: 36px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      color: var(--text-main);
    }
    .icon-btn svg { fill: currentColor; display: block; }
    #btn-open-json svg { width: 19px; height: 19px; }
    #btn-reset svg { width: 16px; height: 16px; }
    #icon-moon { width: 17px; height: 17px; }
    #icon-sun { width: 17.5px; height: 17.5px; stroke: currentColor; stroke-width: 2.4px; stroke-linejoin: round; }
    #btn-back svg { width: 20px; height: 20px; }

    .thread-nav-title { font-size: 20px; font-weight: 700; color: var(--text-main); }

    /* 트윗 레이아웃 */
    .tweet-container {
      border-bottom: 1px solid var(--border-color);
      padding: 14px 24px;
      display: flex;
      gap: 12px;
      cursor: pointer;
      position: relative;
    }

    .avatar-wrapper { position: relative; flex-shrink: 0; }
    .avatar {
      width: 44px; height: 44px; border-radius: 50%; display: flex;
      align-items: center; justify-content: center; overflow: hidden;
    }
    .avatar svg { width: 100%; height: 100%; fill: #ffffff; }

    /* 스레드 수직 연결선 (트위터 1자 관통 라인) */
    .thread-line {
      position: absolute; width: 2px; background-color: var(--thread-line);
      left: 21px; top: 46px; bottom: -29px; z-index: 1;
    }
    .tweet-container.thread-connected { border-bottom-color: transparent; }

    .tweet-content-wrapper { flex: 1; min-width: 0; }
    .tweet-header { display: flex; align-items: baseline; gap: 6px; margin-bottom: 3px; }
    .author-name { font-weight: 700; font-size: 16px; color: var(--text-main); }
    .author-handle, .tweet-time { font-size: 15px; color: var(--text-sub); }
    .tweet-text {
      font-size: 16px; line-height: 1.45; white-space: pre-wrap;
      word-break: break-word; color: var(--text-main);
    }
    .hashtag { color: var(--primary); }

    /* 인용 트윗 카드 */
    .quote-box {
      margin: 10px 0 14px 0;
      border: 1.5px solid var(--border-color);
      border-radius: 14px;
      padding: 12px 14px 10px 14px;
      cursor: pointer;
    }
    .quote-box .tweet-header { margin-bottom: 4px; }
    .quote-box .tweet-text { margin: 0; line-height: 1.35; }
    .detail-tweet .quote-box .tweet-text { font-size: 16px !important; margin: 0 !important; line-height: 1.35 !important; }

    /* 액션 버튼 바 */
    .tweet-actions { display: flex; max-width: 420px; margin-top: 12px; }
    .action-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      background: transparent !important; border: none; outline: none;
      color: var(--text-sub); font-size: 14px; cursor: pointer; padding: 4px 6px;
      border-radius: 9999px; transition: color 0.15s; line-height: 1;
      -webkit-tap-highlight-color: transparent;
      font-variant-numeric: tabular-nums;
    }
    .tweet-container .action-btn { flex: 1; justify-content: flex-start; }
    .action-btn svg { fill: currentColor; display: block; flex-shrink: 0; }
    .action-btn.reply svg { width: 15px; height: 15px; }
    .action-btn.retweet svg { width: 19px; height: 15px; }
    .action-btn.like svg { width: 17px; height: 15px; }
    .action-btn span {
      display: inline-flex; align-items: center; line-height: 1;
      transform: translateY(1.5px);
      font-variant-numeric: tabular-nums;
    }
    @media (hover: hover) and (pointer: fine) {
      .action-btn.reply:hover { color: var(--primary); }
      .action-btn.retweet:hover { color: var(--retweet-color); }
      .action-btn.like:hover { color: var(--like-color); }
    }
    .action-btn.retweet.active { color: var(--retweet-color) !important; background: transparent !important; }
    .action-btn.like.active { color: var(--like-color) !important; background: transparent !important; }

    /* 상세 스레드 뷰 전용 스타일 */
    .detail-tweet { padding: 18px 24px; border-bottom: 1px solid var(--border-color); }
    .detail-tweet .tweet-text { font-size: 19px; line-height: 1.45; margin: 12px 0; }
    .detail-time { font-size: 15px; color: var(--text-sub); margin-bottom: 12px; }
    .detail-stats-actions {
      display: flex; justify-content: flex-end; gap: 20px; padding: 10px 0;
      border-top: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color);
      align-items: center;
    }
    .detail-stats-actions .action-btn { font-size: 15px; gap: 7px; padding: 4px 6px; color: var(--text-sub) !important; }
    .detail-stats-actions .action-btn span { color: var(--text-sub) !important; }
    .detail-stats-actions .action-btn strong {
      color: var(--text-main) !important; margin-right: 4px;
      font-variant-numeric: tabular-nums;
    }
    .detail-stats-actions .action-btn.retweet.active svg { fill: var(--retweet-color) !important; }
    .detail-stats-actions .action-btn.like.active svg { fill: var(--like-color) !important; }
    /* 대댓글 우측 들여쓰기 제거 (상위 댓글과 100% 동일한 수직 1자 정렬) */
    .nested-reply { padding-left: 0; position: relative; }
    .nested-connector { display: none; }

    /* 비어있는 상태 */
    .empty-state { padding: 80px 24px; text-align: center; color: var(--text-sub); }
    .empty-state h3 { font-size: 21px; color: var(--text-main); margin-bottom: 8px; }
    .empty-state p { font-size: 15px; }

    /* 모달 */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: var(--modal-overlay); display: flex; align-items: center;
      justify-content: center; z-index: 1000; opacity: 0; pointer-events: none;
      transition: opacity 0.2s;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-box {
      width: 90%; max-width: 500px; background: var(--modal-bg);
      border-radius: 16px; border: 1px solid var(--border-color);
      padding: 20px; display: flex; flex-direction: column; gap: 14px;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; }
    .modal-title { font-size: 17px; font-weight: 700; color: var(--text-main); }
    .modal-header .icon-btn svg { width: 20.5px; height: 20.5px; }
    .modal-textarea {
      width: 100%; height: 260px; background: var(--bg-color); color: var(--text-main);
      border: 1px solid var(--border-color); border-radius: 8px; padding: 12px;
      font-family: monospace; font-size: 13px; resize: none; outline: none;
    }
    .modal-textarea:focus { border-color: var(--primary); }
    .modal-footer { display: flex; justify-content: flex-end; gap: 8px; }
    .btn { padding: 8px 16px; border-radius: 9999px; font-weight: 700; font-size: 14px; cursor: pointer; border: none; }
    .btn-secondary { background: var(--hover-bg); color: var(--text-main); }
    .btn-primary { background: var(--primary); color: #fff; }
  </style>
</head>
<body>

  <div id="app">
    <!-- 트위터 정품 단일 가변 헤더 -->
    <header>
      <!-- 피드 전용 구성 (JSON 아이콘 + 정중앙 로고) -->
      <div id="header-feed" class="header-group">
        <button id="btn-open-json" class="icon-btn" title="JSON 추가">
          <svg viewBox="0 0 122.88 121.51"><path d="M28.66,1.64H58.88L44.46,16.71H28.66a13.52,13.52,0,0,0-9.59,4l0,0a13.52,13.52,0,0,0-4,9.59v76.14H91.21a13.5,13.5,0,0,0,9.59-4l0,0a13.5,13.5,0,0,0,4-9.59V77.3l15.07-15.74V92.85a28.6,28.6,0,0,1-8.41,20.22l0,.05a28.58,28.58,0,0,1-20.2,8.39H11.5a11.47,11.47,0,0,1-8.1-3.37l0,0A11.52,11.52,0,0,1,0,110V30.3A28.58,28.58,0,0,1,8.41,10.09L8.46,10a28.58,28.58,0,0,1,20.2-8.4ZM73,76.47l-29.42,6,4.25-31.31L73,76.47ZM57.13,41.68,96.3.91A2.74,2.74,0,0,1,99.69.38l22.48,21.76a2.39,2.39,0,0,1-.19,3.57L82.28,67,57.13,41.68Z"/></svg>
        </button>
        <svg class="header-logo" viewBox="0 0 640 640" id="btn-home">
          <path d="M640.012 121.513c-23.528 10.524-48.875 17.516-75.343 20.634 27.118-16.24 47.858-41.977 57.756-72.615-25.347 14.988-53.516 25.985-83.363 31.866-24-25.5-58.087-41.35-95.848-41.35-72.508 0-131.21 58.736-131.21 131.198 0 10.228 1.134 20.232 3.355 29.882-109.1-5.528-205.821-57.757-270.57-137.222a131.423 131.423 0 0 0-17.764 66c0 45.497 23.102 85.738 58.347 109.207-21.508-.638-41.74-6.638-59.505-16.359v1.642c0 63.627 45.225 116.718 105.32 128.718-11.008 2.988-22.63 4.642-34.606 4.642-8.48 0-16.654-.874-24.78-2.35 16.783 52.11 65.233 90.095 122.612 91.205-44.989 35.245-101.493 56.233-163.09 56.233-10.63 0-20.988-.65-31.334-1.89 58.229 37.359 127.206 58.997 201.31 58.997 241.42 0 373.552-200.069 373.552-373.54 0-5.764-.13-11.35-.366-16.996 25.642-18.343 47.87-41.493 65.469-67.844l.059-.059z"/>
        </svg>
      </div>

      <!-- 스레드 전용 구성 (뒤로가기 + 게시물 타이틀) -->
      <div id="header-thread" class="header-group" style="display: none;">
        <button id="btn-back" class="icon-btn" title="뒤로가기">
          <svg viewBox="0 0 24 24"><path d="M7.414 13l5.043 5.04-1.414 1.42L3.586 12l7.457-7.46 1.414 1.42L7.414 11H21v2H7.414z"/></svg>
        </button>
        <div class="thread-nav-title">게시물</div>
      </div>

      <!-- 우측 테마 토글 버튼 (공통 유지) -->
      <div class="header-actions-right">
        <button id="btn-theme-toggle" class="icon-btn" title="다크/라이트 전환">
          <svg id="icon-moon" viewBox="0 0 122.88 122.89"><path d="M49.06,1.27c2.17-0.45,4.34-0.77,6.48-0.98c2.2-0.21,4.38-0.31,6.53-0.29c1.21,0.01,2.18,1,2.17,2.21 c-0.01,0.93-0.6,1.72-1.42,2.03c-9.15,3.6-16.47,10.31-20.96,18.62c-4.42,8.17-6.1,17.88-4.09,27.68l0.01,0.07 c2.29,11.06,8.83,20.15,17.58,25.91c8.74,5.76,19.67,8.18,30.73,5.92l0.07-0.01c7.96-1.65,14.89-5.49,20.3-10.78 c5.6-5.47,9.56-12.48,11.33-20.16c0.27-1.18,1.45-1.91,2.62-1.64c0.89,0.21,1.53,0.93,1.67,1.78c2.64,16.2-1.35,32.07-10.06,44.71 c-8.67,12.58-22.03,21.97-38.18,25.29c-16.62,3.42-33.05-0.22-46.18-8.86C14.52,104.1,4.69,90.45,1.27,73.83 C-2.07,57.6,1.32,41.55,9.53,28.58C17.78,15.57,30.88,5.64,46.91,1.75c0.31-0.08,0.67-0.16,1.06-0.25l0.01,0l0,0L49.06,1.27 L49.06,1.27z"/></svg>

    </header>

    <!-- 피드 뷰 -->
    <main id="feed-view">
      <div class="empty-state" id="empty-state">
        <h3>타임라인이 비어 있습니다.</h3>
        <p>상단 좌측 버튼을 눌러 AI 팬 반응 JSON을 붙여넣어 보세요!</p>
      </div>
      <div id="tweets-list"></div>
    </main>

    <!-- 상세 스레드 뷰 -->
    <main id="thread-view" style="display: none;"></main>
  </div>

  <!-- JSON 입력 모달창 -->
  <div id="json-modal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title">JSON 데이터 추가</div>
        <button id="btn-reset" class="icon-btn" title="전체 데이터 삭제 및 초기화">

        </button>
      </div>
      <textarea id="json-input" class="modal-textarea" placeholder="AI가 생성해준 JSON을 여기에 그대로 붙여넣으세요..."></textarea>
      <div class="modal-footer">
        <button id="btn-cancel-json" class="btn btn-secondary">취소</button>
        <button id="btn-apply-json" class="btn btn-primary">추가하기</button>
      </div>
    </div>
  </div>

  <!-- 자바스크립트 엔진 -->
  <script>
    /* ==========================================================================
       SVG 에셋 정의
       ========================================================================== */
    const ICONS = {
      // 보내주신 프로필 실루엣 SVG
      profile: `<svg viewBox="0 0 122.88 122.88"><path d="M61.44,0A61.31,61.31,0,0,1,84.92,4.66h0A61.66,61.66,0,0,1,118.21,38l.1.24a61.39,61.39,0,0,1-.1,46.73h0A61.42,61.42,0,0,1,38,118.21h0A61.3,61.3,0,0,1,18,104.88l0,0A61.5,61.5,0,0,1,4.66,84.94l-.09-.24A61.48,61.48,0,0,1,4.66,38v0A61.37,61.37,0,0,1,18,18l0,0A61.5,61.5,0,0,1,37.94,4.66l.24-.09A61.35,61.35,0,0,1,61.44,0ZM48.78,79.89a16.44,16.44,0,0,1-1.34-1.62c-2.6-3.56-4.93-7.58-7.27-11.33-1.7-2.5-2.59-4.73-2.59-6.52s1-4.13,3-4.64a101,101,0,0,1-.18-11.73A16.86,16.86,0,0,1,41,41.11a17,17,0,0,1,7.58-9.64,19.26,19.26,0,0,1,4.11-2c2.59-1,1.34-4.91,4.19-5C63.54,24.33,74.52,30,78.8,34.68a16.91,16.91,0,0,1,4.38,11l-.27,10.57a3.31,3.31,0,0,1,2.41,2.41c.36,1.43,0,3.39-1.25,6.16h0c0,.09-.09.09-.09.18-2.75,4.53-5.62,9.78-8.78,14-1.59,2.12-2.9,1.75-1.54,3.78,6.45,8.87,19.18,7.64,27,13.55a52.66,52.66,0,0,0,9.36-54.72l-.09-.2A52.7,52.7,0,0,0,98.55,24.33h0a52.63,52.63,0,0,0-57-11.49l-.21.09a52.53,52.53,0,0,0-17,11.4h0a52.63,52.63,0,0,0-11.49,57l.09.21A52.66,52.66,0,0,0,22.19,96.3c7.85-5.91,20.58-4.68,27-13.55,1.12-1.68.83-1.52-.44-2.86Z"/></svg>`,
      reply: `<svg viewBox="0 0 121.83 122.88"><path fill-rule="evenodd" d="M55.05,97.68l-24.9,23.88a3.95,3.95,0,0,1-6.89-2.62V97.68H10.1A10.16,10.16,0,0,1,0,87.58V10.1A10.18,10.18,0,0,1,10.1,0H111.73a10.16,10.16,0,0,1,10.1,10.1V87.58a10.16,10.16,0,0,1-10.1,10.1ZM27.53,36.61a3.94,3.94,0,0,1,0-7.87H94.3a3.94,3.94,0,1,1,0,7.87Zm0,25.55a3.94,3.94,0,0,1,0-7.87H82a3.94,3.94,0,0,1,0,7.87Z"/></svg>`,
      retweet: `<svg viewBox="0 0 122.88 95.395"><path fill-rule="evenodd" clip-rule="evenodd" d="M29.531,0L0,30.716l19.008,0.002V85.11h21.049v-0.002h14.305l0.413,0.002 l18.863-0.005L53.403,64.059l-13.346,0.002v-33.34l19.006-0.004L29.531,0L29.531,0z M93.347,95.395l29.533-30.717l-19.011-0.002 V36.645l0.002-0.533V10.284l-1.024-0.002H77.013l-23.396,0.002v3.293l17.071,17.754h5.795l0.535,0.002h5.803v33.34l-19.006,0.005 L93.347,95.395L93.347,95.395z"/></svg>`,
      like: `<svg viewBox="0 0 122.88 107.41"><path fill-rule="evenodd" clip-rule="evenodd" d="M60.83,17.19C68.84,8.84,74.45,1.62,86.79,0.21c23.17-2.66,44.48,21.06,32.78,44.41 c-3.33,6.65-10.11,14.56-17.61,22.32c-8.23,8.52-17.34,16.87-23.72,23.2l-17.4,17.26L46.46,93.56C29.16,76.9,0.95,55.93,0.02,29.95 C-0.63,11.75,13.73,0.09,30.25,0.3C45.01,0.5,51.22,7.84,60.83,17.19L60.83,17.19L60.83,17.19z"/></svg>`
    };

    /* ==========================================================================
       IndexedDB 대용량 로컬 저장소 모듈
       ========================================================================== */
    const DB_NAME = 'TwitterRpDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'tweets';

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: 'id' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function dbGetAll() {
      const db = await openDB();
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result || []);
      });
    }

    async function dbPutBatch(items) {
      const db = await openDB();
      const tx = db.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      for (const item of items) {
        store.put(item);
      }
      return new Promise((resolve) => tx.oncomplete = resolve);
    }

    async function dbClear() {
      const db = await openDB();
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).clear();
      return new Promise((resolve) => tx.oncomplete = resolve);
    }

    /* ==========================================================================
       유틸리티: 파스텔톤 컬러 생성기 & 텍스트 파서
       ========================================================================== */
    const PASTELS = [
      '#6E7D8C', '#8C7373', '#738575', '#7D7385', '#857A6E',
      '#6B8282', '#80716B', '#7B826B', '#70758A', '#877670', '#727B80'
    ];
    function getAvatarBg(str = '') {
      let hash = 0;
      for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
      return PASTELS[Math.abs(hash) % PASTELS.length];
    }

    function formatText(text = '') {
      return text.replace(/(#[^\s#]+|@[^\s@]+)/g, '<span class="hashtag">$1</span>');
    }

    /* ==========================================================================
       전역 상태 및 모바일 뒤로가기 제스처 연동 (History API)
       ========================================================================== */
    let tweetsData = [];

    // 모바일 뒤로가기 제스처 / 브라우저 뒤로가기 버튼 감지
    window.addEventListener('popstate', (e) => {
      const state = e.state;
      // 팝업이 열려있다면 팝업 닫기
      if (document.getElementById('json-modal').classList.contains('active')) {
        closeModal();
        return;
      }
      if (!state || state.view === 'feed') {
        renderFeedView();
      } else if (state.view === 'thread' && state.tweetId) {
        renderThreadView(state.tweetId, false);
      }
    });

    function navigateTo(state) {
      history.pushState(state, '', '');
      if (state.view === 'feed') renderFeedView();
      else if (state.view === 'thread') renderThreadView(state.tweetId, false);
    }

    /* ==========================================================================
       화면 렌더링 엔진
       ========================================================================== */
    const feedView = document.getElementById('feed-view');
    const threadView = document.getElementById('thread-view');
    const tweetsList = document.getElementById('tweets-list');
    const emptyState = document.getElementById('empty-state');
    const headerFeed = document.getElementById('header-feed');
    const headerThread = document.getElementById('header-thread');

    function renderFeedView() {
      feedView.style.display = 'block';
      threadView.style.display = 'none';
      headerFeed.style.display = 'flex';
      headerThread.style.display = 'none';
      window.scrollTo(0, 0);

      if (tweetsData.length === 0) {
        emptyState.style.display = 'block';
        tweetsList.innerHTML = '';
        return;
      }

      emptyState.style.display = 'none';
      tweetsList.innerHTML = tweetsData.map(t => createTweetCardHTML(t)).join('');
      bindActionEvents(tweetsList);
    }

    function createTweetCardHTML(tweet, hasThreadLine = false) {
      const bg = getAvatarBg(tweet.author.handle || tweet.author.name);
      const isLiked = tweet._userLiked ? 'active' : '';
      const isRetweeted = tweet._userRetweeted ? 'active' : '';
      const repliesCnt = (tweet.replies ? tweet.replies.length : 0);

      // 인용 트윗 카드 HTML
      let quoteHTML = '';
      if (tweet.quote) {
        const qBg = getAvatarBg(tweet.quote.author?.handle || tweet.quote.author?.name);
        quoteHTML = `
          <div class="quote-box" data-quote-id="${tweet.quote.id || ''}">
            <div class="tweet-header">
              <span class="author-name">${tweet.quote.author?.name || '익명'}</span>
              <span class="author-handle">@${tweet.quote.author?.handle || 'anon'}</span>
              <span class="tweet-time">· ${tweet.quote.timestamp || ''}</span>
            </div>
            <div class="tweet-text">${formatText(tweet.quote.content)}</div>
          </div>
        `;
      }

      return `
        <article class="tweet-container ${hasThreadLine ? 'thread-connected' : ''}" data-tweet-id="${tweet.id}">
          <div class="avatar-wrapper">
            <div class="avatar" style="background-color: ${bg};">${ICONS.profile}</div>
            ${hasThreadLine ? '<div class="thread-line"></div>' : ''}
          </div>
          <div class="tweet-content-wrapper">
            <div class="tweet-header">
              <span class="author-name">${tweet.author.name}</span>
              <span class="author-handle">@${tweet.author.handle}</span>
              <span class="tweet-time">· ${tweet.timestamp}</span>
            </div>
            <div class="tweet-text">${formatText(tweet.content)}</div>
            ${quoteHTML}
            <div class="tweet-actions">
              <button class="action-btn reply">
                ${ICONS.reply} <span>${repliesCnt || ''}</span>
              </button>
              <button class="action-btn retweet ${isRetweeted}">
                ${ICONS.retweet} <span>${tweet.retweets || 0}</span>
              </button>
              <button class="action-btn like ${isLiked}">
                ${ICONS.like} <span>${tweet.likes || 0}</span>
              </button>
            </div>
          </div>
        </article>
      `;
    }

    function renderThreadView(tweetId, pushHistory = true) {
      const tweet = findTweetOrReplyById(tweetsData, tweetId);
      if (!tweet) return;

      if (pushHistory) {
        history.pushState({ view: 'thread', tweetId: tweet.id }, '', '');
      }

      feedView.style.display = 'none';
      threadView.style.display = 'block';
      headerFeed.style.display = 'none';
      headerThread.style.display = 'flex';
      window.scrollTo(0, 0);

      const bg = getAvatarBg(tweet.author.handle || tweet.author.name);
      const isLiked = tweet._userLiked ? 'active' : '';
      const isRetweeted = tweet._userRetweeted ? 'active' : '';

      // 인용 트윗 카드
      let quoteHTML = '';
      if (tweet.quote) {
        quoteHTML = `
          <div class="quote-box" data-quote-id="${tweet.quote.id || ''}">
            <div class="tweet-header">
              <span class="author-name">${tweet.quote.author?.name || '익명'}</span>
              <span class="author-handle">@${tweet.quote.author?.handle || 'anon'}</span>
              <span class="tweet-time">· ${tweet.quote.timestamp || ''}</span>
            </div>
            <div class="tweet-text">${formatText(tweet.quote.content)}</div>
          </div>
        `;
      }

      // 답글 및 대댓글 렌더링 (트위터 1자 타래 연결)
      let repliesHTML = '';
      if (tweet.replies && tweet.replies.length > 0) {
        repliesHTML = tweet.replies.map(r => {
          const hasSubReplies = r.replies && r.replies.length > 0;
          let subRepliesHTML = '';
          if (hasSubReplies) {
            subRepliesHTML = r.replies.map((sub, sIdx) => {
              const isLastSub = sIdx === r.replies.length - 1;
              return createTweetCardHTML(sub, !isLastSub);
            }).join('');
          }
          return `
            <div>
              ${createTweetCardHTML(r, hasSubReplies)}
              ${subRepliesHTML}
            </div>
          `;
        }).join('');
      }

      const repliesCnt = (tweet.replies ? tweet.replies.length : 0);
      threadView.innerHTML = `
        <div class="detail-tweet" data-tweet-id="${tweet.id}">
          <div style="display:flex; gap:12px; align-items:center;">
            <div class="avatar" style="background-color: ${bg};">${ICONS.profile}</div>
            <div>
              <div class="author-name" style="font-size:17px;">${tweet.author.name}</div>
              <div class="author-handle">@${tweet.author.handle}</div>
            </div>
          </div>
          <div class="tweet-text">${formatText(tweet.content)}</div>
          ${quoteHTML}
          <div class="detail-time">${tweet.timestamp}</div>
          <div class="detail-stats-actions">
            <button class="action-btn retweet ${isRetweeted}">
              ${ICONS.retweet} <span><strong>${tweet.retweets || 0}</strong> 리트윗</span>
            </button>
            <button class="action-btn like ${isLiked}">
              ${ICONS.like} <span><strong>${tweet.likes || 0}</strong> 마음에 들어요</span>
            </button>
          </div>
        </div>
        <div class="thread-replies-list">${repliesHTML}</div>
      `;

      bindActionEvents(threadView);
    }

    function findTweetOrReplyById(list, id) {
      for (const item of list) {
        if (String(item.id) === String(id)) return item;
        if (item.quote && String(item.quote.id) === String(id)) return item.quote;
        if (item.replies) {
          const found = findTweetOrReplyById(item.replies, id);
          if (found) return found;
        }
      }
      return null;
    }

    /* ==========================================================================
       이벤트 바인딩 (터치 인터랙션, 좋아요/리트윗 토글)
       ========================================================================== */
    function bindActionEvents(container) {
      container.querySelectorAll('.tweet-container, .detail-tweet').forEach(el => {
        el.onclick = (e) => {
          // 인용 박스를 누른 경우 인용 원글 스레드로 이동
          const quoteBox = e.target.closest('.quote-box');
          if (quoteBox) {
            const qId = quoteBox.dataset.quoteId;
            if (qId) {
              e.stopPropagation();
              navigateTo({ view: 'thread', tweetId: qId });
            }
            return;
          }

          // 좋아요 / 리트윗 클릭 인터랙션
          const actionBtn = e.target.closest('.action-btn');
          if (actionBtn) {
            e.stopPropagation();
            const tweetId = el.dataset.tweetId;
            const target = findTweetOrReplyById(tweetsData, tweetId);
            if (!target) return;

            if (actionBtn.classList.contains('like')) {
              target._userLiked = !target._userLiked;
              target.likes = (target.likes || 0) + (target._userLiked ? 1 : -1);
              actionBtn.classList.toggle('active', target._userLiked);
              const strong = actionBtn.querySelector('strong');
              if (strong) {
                strong.textContent = target.likes || 0;
              } else {
                const span = actionBtn.querySelector('span');
                if (span) span.textContent = target.likes || '';
              }
            } else if (actionBtn.classList.contains('retweet')) {
              target._userRetweeted = !target._userRetweeted;
              target.retweets = (target.retweets || 0) + (target._userRetweeted ? 1 : -1);
              actionBtn.classList.toggle('active', target._userRetweeted);
              const strong = actionBtn.querySelector('strong');
              if (strong) {
                strong.textContent = target.retweets || 0;
              } else {
                const span = actionBtn.querySelector('span');
                if (span) span.textContent = target.retweets || '';
              }
            }
            actionBtn.blur();
            // IndexedDB에 인터랙션 결과 자동 반영
            dbPutBatch(tweetsData);
            return;
          }

          // 트윗 본문 영역 터치 시 스레드로 진입 (이미 상세뷰가 아닐 때만)
          if (!el.classList.contains('detail-tweet')) {
            const tweetId = el.dataset.tweetId;
            navigateTo({ view: 'thread', tweetId });
          }
        };
      });
    }

    /* ==========================================================================
       헤더 액션: 뒤로가기, 테마 전환, 초기화, 모달 제어
       ========================================================================== */
    // 뒤로가기 버튼 누름 -> 브라우저 popstate 트리거 (기기 제스처와 일치)
    document.getElementById('btn-back').onclick = () => history.back();
    document.getElementById('btn-home').onclick = () => navigateTo({ view: 'feed' });

    // 다크 / 라이트 테마 토글
    const themeBtn = document.getElementById('btn-theme-toggle');
    const moonIcon = document.getElementById('icon-moon');
    const sunIcon = document.getElementById('icon-sun');

    themeBtn.onclick = () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const nextTheme = isDark ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', nextTheme);
      moonIcon.style.display = isDark ? 'none' : 'block';
      sunIcon.style.display = isDark ? 'block' : 'none';
      localStorage.setItem('rp_theme', nextTheme);
    };

    // 저장된 테마 불러오기
    const savedTheme = localStorage.getItem('rp_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    moonIcon.style.display = savedTheme === 'dark' ? 'block' : 'none';
    sunIcon.style.display = savedTheme === 'dark' ? 'none' : 'block';

    // 전체 삭제 (모달창 유지한 채 초기화)
    document.getElementById('btn-reset').onclick = async () => {
      if (confirm('모든 데이터를 삭제하고 초기화할까요?')) {
        await dbClear();
        tweetsData = [];
        renderFeedView();
        jsonInput.value = '';
      }
    };

    // JSON 모달 제어
    const modal = document.getElementById('json-modal');
    const jsonInput = document.getElementById('json-input');

    function openModal() {
      history.pushState({ modal: true }, '', '');
      modal.classList.add('active');
      jsonInput.value = '';
      jsonInput.focus();
    }
    function closeModal() {
      modal.classList.remove('active');
    }

    document.getElementById('btn-open-json').onclick = openModal;
    document.getElementById('btn-cancel-json').onclick = () => history.back();

    // JSON 데이터 추가 적용 (이어붙이기 지원)
    document.getElementById('btn-apply-json').onclick = async () => {
      const raw = jsonInput.value.trim();
      if (!raw) return alert('JSON 데이터를 입력해주세요!');

      try {
        let parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) parsed = [parsed];

        // 기존 데이터에 새 데이터 이어붙이기 (중복 ID 덮어쓰기)
        const map = new Map();
        tweetsData.forEach(t => map.set(String(t.id), t));
        parsed.forEach(t => map.set(String(t.id), t));
        tweetsData = Array.from(map.values());

        await dbPutBatch(tweetsData);
        history.back(); // 모달 닫기
        renderFeedView();
      } catch (err) {
        alert('올바른 JSON 형식이 아닙니다. 형식을 확인해주세요!\n' + err.message);
      }
    };

    /* ==========================================================================
       앱 초기 구동 (IndexedDB 로드)
       ========================================================================== */
    async function initApp() {
      history.replaceState({ view: 'feed' }, '', '');
      tweetsData = await dbGetAll();
      renderFeedView();
    }

    initApp();
  </script>
</body>
